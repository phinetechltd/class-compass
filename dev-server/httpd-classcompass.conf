# Class Compass local server: XAMPP's Apache + PHP 8.3, independent of XAMPP's own httpd.conf.
# Start:  C:\xampp\apache\bin\httpd.exe -f "<this file>"
#   API      -> http://127.0.0.1:8000  (cleaned/api/public)
#   Web app  -> http://127.0.0.1:5000  (cleaned/web-app/build/web)
Define CC_ROOT "C:/Users/ondie/Downloads/Mighty School Pro v1.6/cleaned"
Define PHP_DIR "C:/Users/ondie/AppData/Local/Microsoft/WinGet/Packages/PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe"

ServerRoot "C:/xampp/apache"
ServerName 127.0.0.1
Listen 127.0.0.1:8000
Listen 127.0.0.1:5000
PidFile "${CC_ROOT}/dev-server/logs/httpd.pid"
ErrorLog "${CC_ROOT}/dev-server/logs/error.log"
LogLevel warn

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule env_module modules/mod_env.so
LoadModule log_config_module modules/mod_log_config.so

LoadFile "${PHP_DIR}/php8ts.dll"
LoadFile "${PHP_DIR}/libssh2.dll"
LoadModule php_module "${PHP_DIR}/php8apache2_4.dll"
PHPIniDir "${CC_ROOT}/dev-server/php"
AddHandler application/x-httpd-php .php

TypesConfig conf/mime.types
AddType application/wasm .wasm
AddType application/javascript .mjs
DirectoryIndex index.php index.html
ThreadsPerChild 64

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:8000>
    DocumentRoot "${CC_ROOT}/api/public"
    <Directory "${CC_ROOT}/api/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory "${CC_ROOT}/api/storage/app/public">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost 127.0.0.1:5000>
    DocumentRoot "${CC_ROOT}/web-app/build/web"
    <Directory "${CC_ROOT}/web-app/build/web">
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
