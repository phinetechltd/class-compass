  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const currentUrl = window.location.origin + window.location.pathname;

      // Canonical
      let canonical = document.querySelector("link[rel='canonical']");
      if (!canonical) {
        canonical = document.createElement("link");
        canonical.rel = "canonical";
        document.head.appendChild(canonical);
      }
      canonical.href = currentUrl;

      // OG URL
      const og = document.querySelector("meta[property='og:url']");
      if (og) og.setAttribute("content", currentUrl);

    });
  </script>

  <script>
    (function () {

      function updateSeoUrls() {

        const currentUrl = window.location.origin + window.location.pathname;

        // Canonical
        let canonical = document.querySelector("link[rel='canonical']");
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }
        canonical.setAttribute("href", currentUrl);

        // OG URL
        let ogUrl = document.querySelector("meta[property='og:url']");
        if (!ogUrl) {
          ogUrl = document.createElement("meta");
          ogUrl.setAttribute("property", "og:url");
          document.head.appendChild(ogUrl);
        }
        ogUrl.setAttribute("content", currentUrl);

      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", updateSeoUrls);
      } else {
        updateSeoUrls();
      }

    })();
  </script>

<!-- Class Compass splash: shown until the Flutter engine has rendered its first frame -->
<style>
  #cc-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(1200px 600px at 50% 35%,#eef5ff 0%,#ffffff 60%);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    transition:opacity .45s ease,visibility .45s ease}
  #cc-splash.cc-hide{opacity:0;visibility:hidden}
  .cc-badge{position:relative;width:132px;height:132px;display:grid;place-items:center}
  .cc-ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(1,109,246,0) 0deg,#016DF6 120deg,#00C090 240deg,rgba(0,192,144,0) 300deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
    animation:cc-spin 1.4s cubic-bezier(.55,.15,.45,.85) infinite}
  .cc-track{position:absolute;inset:0;border-radius:50%;border:5px solid rgba(4,50,104,.07)}
  .cc-core{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;
    box-shadow:0 10px 30px rgba(4,50,104,.12);animation:cc-pulse 2.4s ease-in-out infinite}
  .cc-core img{width:68px;height:68px;object-fit:contain}.cc-dark{display:none}
  .cc-word{margin-top:26px;font-size:28px;font-weight:800;letter-spacing:-.5px;opacity:0;transform:translateY(6px);
    animation:cc-rise .7s .25s ease forwards}
  .cc-word .a{color:#043268}.cc-word .b{color:#00C090}
  .cc-tag{margin-top:6px;font-size:11px;letter-spacing:4px;color:#5b6b82;text-transform:uppercase;opacity:0;animation:cc-rise .7s .45s ease forwards}
  .cc-bar{margin-top:28px;width:180px;height:3px;border-radius:3px;background:rgba(4,50,104,.08);overflow:hidden}
  .cc-bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#016DF6,#00C090);animation:cc-slide 1.3s ease-in-out infinite}
  .cc-msg{margin-top:14px;height:18px;font-size:13px;color:#7a879a;transition:opacity .3s}
  @keyframes cc-spin{to{transform:rotate(360deg)}}
  @keyframes cc-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes cc-rise{to{opacity:1;transform:none}}
  @keyframes cc-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-color-scheme:dark){
    #cc-splash{background:radial-gradient(1200px 600px at 50% 35%,#0b2147 0%,#071631 65%)}
    .cc-core{background:#0f2a55;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .cc-light{display:none}.cc-dark{display:block}.cc-word .a{color:#ffffff}.cc-tag,.cc-msg{color:#9fb3cf}.cc-track{border-color:rgba(255,255,255,.08)}.cc-bar{background:rgba(255,255,255,.1)}}
  body.theme-dark #cc-splash{background:radial-gradient(1200px 600px at 50% 35%,#0b2147 0%,#071631 65%)}
  body.theme-dark .cc-core{background:#0f2a55}body.theme-dark .cc-light{display:none}body.theme-dark .cc-dark{display:block}body.theme-dark .cc-word .a{color:#fff}
  body.theme-dark .cc-tag,body.theme-dark .cc-msg{color:#9fb3cf}
  @media (prefers-reduced-motion:reduce){.cc-ring,.cc-core,.cc-bar i{animation-duration:6s}.cc-word,.cc-tag{animation:none;opacity:1;transform:none}}
</style>

<script>
  (function () {
    var msgs = ["Preparing your school…", "Loading classes and learners…", "Syncing fees and M-Pesa payments…", "Almost there…"];
    var i = 0, el = document.getElementById('cc-msg');
    window.__ccSplashTimer = setInterval(function () {
      if (!el) return;
      el.style.opacity = 0;
      setTimeout(function () { i = (i + 1) % msgs.length; el.textContent = msgs[i]; el.style.opacity = 1; }, 300);
    }, 2200);
  })();
</script>

<!-- Replace inline SVGs -->
<script>
  document.querySelectorAll("img.svg").forEach(function (img) {
    var imgID = img.getAttribute("id");
    var imgClass = img.getAttribute("class");
    var imgURL = img.getAttribute("src");
    var xhr = new XMLHttpRequest();
    xhr.open("GET", imgURL, true);
    xhr.responseType = "document";
    xhr.onload = function () {
      if (xhr.status === 200) {
        var data = xhr.response;
        var svg = data.querySelector("svg");
        if (typeof imgID !== "undefined") {
          svg.setAttribute("id", imgID);
        }
        if (typeof imgClass !== "undefined") {
          svg.setAttribute("class", imgClass + " replaced-svg");
        }
        svg.removeAttribute("xmlns:a");
        if (!svg.getAttribute("viewBox") && svg.getAttribute("height") && svg.getAttribute("width")) {
          svg.setAttribute("viewBox", "0 0 " + svg.getAttribute("height") + " " + svg.getAttribute("width"));
        }
        img.parentNode.replaceChild(svg, img);
      }
    };
    xhr.send();
  });
</script>

<!-- Flutter Loader -->
<script>
  window.addEventListener('load', function(ev) {
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      serviceWorker: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          if(document.getElementById('splash'))
            document.getElementById('splash').remove();

          // Fade the splash out once Flutter has painted its first frame.
          window.addEventListener('flutter-first-frame', function () {
            var splash = document.getElementById('cc-splash');
            if (!splash) return;
            clearInterval(window.__ccSplashTimer);
            splash.classList.add('cc-hide');
            setTimeout(function () { splash.remove(); }, 500);
          }, { once: true });

          appRunner.runApp();
          setTimeout(function () { window.dispatchEvent(new Event('flutter-first-frame')); }, 12000);
        });
      }
    });
  });
</script>

<!-- Theme from localStorage -->
<script>
  if (typeof(Storage) !== "undefined") {
    var itemValue = localStorage.getItem("flutter.demand_theme");
    console.log("flutter.theme", itemValue);
    if (itemValue !== null) {
      if (itemValue === "true") {
        document.body.classList.add("theme-dark");
      } else {
        document.body.classList.remove("theme-light");
      }
    } else {
      console.log("Item not found in localStorage");
    }
  } else {
    console.log("localStorage is not supported in this browser");
  }
</script>
